packages:
  - apps/*
  - packages/*
  - tooling/*

# Política de dependencias (ver docs/REPO_RULES.md §4):
# - Toda dependencia externa se declara aquí y se usa como "catalog:" en los package.json.
#   Así existe UNA sola versión de cada librería en todo el monorepo.
# - `pnpm add` solo acepta versiones del catálogo.
catalogMode: strict
# Supply chain: no instalar versiones publicadas hace menos de 3 días.
minimumReleaseAge: 4320
# Solo estos paquetes pueden ejecutar scripts de instalación (postinstall, etc.).
# Agregar uno nuevo requiere justificarlo en el PR.
allowBuilds:
  "@prisma/engines": true # motor de Prisma (CLI de migraciones)
  prisma: true # CLI de Prisma
  esbuild: true # binario nativo usado por tsup/vite/tsx
  "@sentry/cli": true # subida de source maps (Next.js / React Native)
  msgpackr-extract: true # serialización nativa opcional de BullMQ
  protobufjs: false # su postinstall no es necesario (OpenTelemetry)

catalog:
  # --- Lenguaje y utilidades -------------------------------------------------
  # TS 6.0: typescript-eslint aún no soporta TS 7 (peer: <6.1.0).
  typescript: ~6.0.3
  "@types/node": ^26.6.6
  zod: ^4.6.7
  superjson: ^2.2.6
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0

  # --- React / React Native (versiones fijadas por Expo SDK 58) -------------
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  react-native: 0.88.1
  react-native-web: ~0.21.4

  # --- Expo -----------------------------------------------------------------
  expo: ~58.0.22
  expo-router: ~58.0.29
  expo-constants: ~58.0.14
  expo-linking: ~58.0.15
  expo-status-bar: ~58.0.4
  expo-splash-screen: ~58.0.12
  expo-secure-store: ~58.0.2
  expo-network: ~58.0.4
  expo-web-browser: ~58.0.7
  expo-system-ui: ~58.0.7
  expo-dev-client: ~58.0.18
  expo-updates: ~58.0.20
  "@expo/metro-runtime": ~58.0.16
  react-native-reanimated: 4.7.1
  react-native-worklets: 0.13.0
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.1
  "@sentry/react-native": ~8.28.0
  babel-preset-expo: ~58.0.22

  # --- Estilos (NativeWind 4 estable requiere Tailwind 3) --------------------
  nativewind: ^4.2.7
  react-native-css-interop: 0.2.7 # misma versión que usa nativewind 4.2.7
  tailwindcss: ~3.4.19
  postcss: ^8.5.32
  autoprefixer: ^10.6.2

  # --- Web ------------------------------------------------------------------
  next: ~16.4.3
  "@sentry/nextjs": ^11.10.0

  # --- API ------------------------------------------------------------------
  fastify: ^5.12.7
  "@fastify/cors": ^11.3.1
  "@fastify/helmet": ^13.2.0
  "@fastify/rate-limit": ^11.2.1
  "@trpc/server": ^11.22.1
  "@trpc/client": ^11.22.1
  "@trpc/tanstack-react-query": ^11.22.1
  "@tanstack/react-query": ^5.105.0

  # --- Auth -----------------------------------------------------------------
  better-auth: ^1.7.14
  "@better-auth/core": ^1.7.14
  "@better-auth/expo": ^1.7.14

  # --- Base de datos (Prisma 7 estable; 8.x sigue en RC) ---------------------
  prisma: ~7.10.1
  "@prisma/client": ~7.10.1
  "@prisma/adapter-pg": ~7.10.1
  dotenv: ^18.0.9

  # --- Jobs / email ---------------------------------------------------------
  bullmq: ^6.5.2
  ioredis: ^6.0.0 # peer opcional de BullMQ: el driver de Redis
  nodemailer: ^10.3.1

  # --- Observabilidad -------------------------------------------------------
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  "@sentry/node": ^11.10.0
  "@opentelemetry/api": ^1.10.0
  "@opentelemetry/sdk-node": ^0.300.0
  "@opentelemetry/auto-instrumentations-node": ^0.82.0
  "@opentelemetry/instrumentation": ^0.300.0 # hook ESM para auto-instrumentación
  import-in-the-middle: ^3.5.3 # loader ESM que usa OpenTelemetry para parchear imports
  "@fastify/otel": ^0.21.4 # instrumentación oficial de Fastify (reemplaza a instrumentation-fastify)
  "@opentelemetry/exporter-trace-otlp-http": ^0.300.0
  "@opentelemetry/resources": ^3.0.0
  "@opentelemetry/semantic-conventions": ^1.44.0

  # --- Build y tests --------------------------------------------------------
  tsup: ^9.0.0
  tsx: ^4.23.15
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "@playwright/test": ^1.64.1
  "@axe-core/playwright": ^4.14.0 # auditoría WCAG automatizada en E2E

  # --- Storybook ------------------------------------------------------------
  storybook: ^10.6.5
  "@storybook/react-native-web-vite": ^10.6.5
  "@storybook/addon-docs": ^10.6.5
  "@storybook/addon-a11y": ^10.6.5
  vite: ^8.3.5

  # --- Calidad --------------------------------------------------------------
  eslint: ^10.14.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.72.1
  "@eslint-react/eslint-plugin": ^5.28.8
  eslint-plugin-react-hooks: ^7.1.1
  "@next/eslint-plugin-next": ~16.4.3
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  prettier: ^3.9.10
  dependency-cruiser: ^18.7.0

  # --- Repo -----------------------------------------------------------------
  turbo: ^2.11.10
  husky: ^9.1.7
  lint-staged: ^17.6.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@changesets/cli": ^3.0.3
