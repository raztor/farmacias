name: Setup
description: Installs pnpm (version from package.json#packageManager), Node.js (.nvmrc) and the workspace dependencies.

runs:
  using: composite
  steps:
    # Node 26 no longer bundles corepack, so pnpm is installed by its own action.
    # Without a `version` input it reads package.json#packageManager (pnpm@12.16.1).
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
