name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder so `prisma generate` (prisma.config.ts) can load; no database is used in `quality`.
  DATABASE_URL: postgresql://app:app@localhost:5432/app

jobs:
  quality:
    name: Calidad (format, reglas, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: `turbo --affected` compares against the PR base commit.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-quality-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-quality-

      - name: Format
        run: pnpm format:check

      - name: Dependency policy
        run: pnpm check:deps

      - name: Naming conventions
        run: pnpm check:naming

      - name: Architecture rules
        run: pnpm check:arch

      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          # Pull requests only run tasks of workspaces affected since the base commit.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          SKIP_ENV_VALIDATION: "true"

  integration:
    name: Integración (PostgreSQL) y cobertura de servicios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin connection: each run creates, migrates (prisma migrate deploy) and drops its own
      # database (packages/api/vitest.integration.config.ts). Without it the run fails in CI.
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Integration tests (PostgreSQL real)
        run: pnpm test:integration

      - name: Cobertura de servicios (umbral v8 en *.service.ts)
        run: pnpm --filter @repo/api test:coverage

      - name: Resumen de cobertura
        if: ${{ always() && hashFiles('packages/api/coverage/coverage-summary.json') != '' }}
        run: >-
          node -e "const t = require('./packages/api/coverage/coverage-summary.json').total;
          const rows = ['lines', 'statements', 'functions', 'branches'].map((k) => '| ' + k + ' | ' + t[k].pct + '% |');
          console.log(['### Cobertura @repo/api (unitarias)', '', '| Métrica | % |', '| --- | --- |', ...rows].join('\n'))"
          >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright, stack completo, matriz de navegadores)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same infrastructure as docker-compose.yml, as job services (docs/validation/e2e.md).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # apps/e2e/src/scripts/e2e-stack.ts: migrate + seed the dedicated `farmacias_e2e` database,
      # build server/worker/admin/web export, start them and run every Playwright project.
      E2E_SERVICES: external
      E2E_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/farmacias_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379/1
      # Also run on the Google Chrome and Microsoft Edge preinstalled on ubuntu-latest (RNF-03).
      E2E_BRANDED_BROWSERS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-e2e-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-e2e-

      - name: Install Playwright (Chromium, Firefox, WebKit)
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium firefox webkit

      - name: Run E2E (stack completo)
        run: pnpm --filter @repo/e2e e2e:full

      - name: Resumen de la matriz de navegadores
        if: ${{ always() && hashFiles('apps/e2e/test-results/results.json') != '' }}
        run: node apps/e2e/src/scripts/matrix-summary.ts apps/e2e/test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report and stack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          include-hidden-files: true
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            apps/e2e/.cache/stack-logs
          retention-days: 7

  docker:
    name: Docker (${{ matrix.image }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            file: apps/server/Dockerfile
          - image: worker
            file: apps/worker/Dockerfile
          - image: admin
            file: apps/admin/Dockerfile
          - image: mobile-web
            file: apps/mobile/Dockerfile.web
          - image: migrate
            file: docker/migrate.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: farmacias-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  mobile:
    name: Mobile (expo export android)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: http://localhost:4000
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Export bundle (smoke test)
        run: pnpm --filter @repo/mobile exec expo export --platform android --output-dir dist-export
