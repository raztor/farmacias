# La app abre en la pantalla de inicio de sesión (sin sesión guardada) y valida el formulario.
appId: cl.bnp.farmacias
name: Pantalla de inicio de sesión
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sign-in-submit"
    timeout: 20000
- assertVisible: "Iniciar sesión"
- assertVisible:
    id: "sign-in-email"
- assertVisible:
    id: "sign-in-password"
- tapOn:
    id: "sign-in-submit"
- assertVisible: "Ingresa un correo electrónico válido"
- assertVisible: "Ingresa tu contraseña"
